name: Build Paddle-Lite-Demo Android OCR

on:
  workflow_dispatch:

env:
  NDK_VERSION: r20b
  CMAKE_VERSION: 3.20.0

jobs:
  build-android-ocr:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout feature/paddle-x branch
      uses: actions/checkout@v4
      with:
        ref: 'feature/paddle-x'

    - name: Check directory structure
      run: |
        echo "Checking /home/runner/work/"
        ls -la /home/runner/work/
        echo ""
        echo "Checking Paddle-Lite-Demo directory"
        ls -la /home/runner/work/Paddle-Lite-Demo/
        echo ""
        echo "Checking Paddle-Lite-Demo/Paddle-Lite-Demo directory"
        ls -la /home/runner/work/Paddle-Lite-Demo/Paddle-Lite-Demo/
        
    - name: Install basic tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl tar unzip
        
    - name: Setup Android NDK r20b
      run: |
        # 下载并安装 Android NDK r20b
        wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux-x86_64.zip
        sudo unzip -q android-ndk-${{ env.NDK_VERSION }}-linux-x86_64.zip -d $HOME
        # 创建软链接到 /opt/android-ndk-r20b 以匹配 build.sh 中的路径
        sudo ln -sf $HOME/android-ndk-${{ env.NDK_VERSION }} /opt/android-ndk-${{ env.NDK_VERSION }}
        echo "NDK_ROOT=/opt/android-ndk-r20b" >> $GITHUB_ENV

    - name: Setup CMake 3.20.0
      run: |
        # 安装指定版本的 CMake
        wget -q https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz
        sudo tar -xzf cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz -C /opt/
        sudo ln -sf /opt/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64/bin/* /usr/local/bin/
        echo "CMake version:"
        cmake --version


    - name: Download dependencies using download.sh
      run: |
        cd /home/runner/work/Paddle-Lite-Demo/Paddle-Lite-Demo/libs
        
        echo "运行 download.sh 下载依赖库..."
        chmod +x download.sh
        ./download.sh
        
        echo "下载完成，检查文件结构..."
        echo "Android 目录内容:"
        ls -la android/
        echo "查找关键文件..."
        find . -name "*.so" | head -10
        find . -name "paddle_api.h" | head -5
        find . -name "core.hpp" | head -5

    - name: Build using build.sh
      run: |
        cd /home/runner/work/Paddle-Lite-Demo/Paddle-Lite-Demo/ocr/android/shell/ppocr_demo
        
        echo "运行 build.sh 进行编译..."
        chmod +x build.sh
        
        # 设置环境变量（build.sh 需要）
        export NDK_ROOT=/opt/android-ndk-r20b
        
        # 运行编译脚本
        ./build.sh arm64-v8a
        
        echo "编译完成！"

    - name: Verify and package build results
      run: |
        cd /home/runner/work/Paddle-Lite-Demo/Paddle-Lite-Demo/ocr/android/shell/ppocr_demo
        
        echo "检查编译结果..."
        if [ -f "ppocr_demo/ppocr_demo" ]; then
          echo "✅ 编译成功！找到可执行文件"
          ls -la ppocr_demo/
          
          # 检查文件类型
          file ppocr_demo/ppocr_demo
          
          # 创建发布包
          tar -czf ppocr_demo_android_arm64-v8a.tar.gz ppocr_demo/
          echo "打包完成，文件大小:"
          ls -lh ppocr_demo_android_arm64-v8a.tar.gz
        else
          echo "❌ 编译失败：未生成可执行文件"
          echo "当前目录内容:"
          ls -la
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ppocr-demo-android
        path: |
          /home/runner/work/Paddle-Lite-Demo/Paddle-Lite-Demo/ocr/android/shell/ppocr_demo/ppocr_demo_android_arm64-v8a.tar.gz
        retention-days: 30
